org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 服务端地址的占位默认值，仅用于模拟器联调（10.0.2.2 是模拟器访问宿主机 localhost 的固定地址）。
# 真实环境地址不要写在这个文件里（会随仓库公开）：
#   - 本机编译：在 android/local.properties 里加一行 custodysim.baseUrl=https://<你的域名>
#     （该文件已在 .gitignore 中，不会入库）
#   - CI：导出环境变量 CUSTODYSIM_BASE_URL
# 取值优先级：local.properties > CUSTODYSIM_BASE_URL > 本文件。
# 注意：该值通过 buildConfigField 在编译期写入 APK，改完必须重新构建安装。
custodysim.baseUrl=http://10.0.2.2:3000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
