[versions]
# AGP 9.4 要求 Gradle >= 9.6.0（官方兼容表）；AGP 9 起内置 Kotlin，无需 kotlin-android 插件。
agp = "9.4.1"
# MiuiX 0.9.3 的元数据是 Kotlin 2.4.0 编译的，低于此版本读不了（AGP 9 内置的 KGP 默认 2.2.10）
kotlin = "2.4.0"
composeBom = "2026.09.00"

coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
work = "2.9.1"
datastore = "1.1.1"
okhttp = "4.12.0"
junit = "4.13.2"
backdrop = "2.0.1"
androidSvg = "1.4"
androidTestRunner = "1.7.0"
exifInterface = "1.4.2"
# MiuiX（小米 HyperOS 风格 Compose 组件库）。纯 Android 项目必须用带 -android 后缀的构件。
miuix = "0.9.3"
# MiuiX 的弹层内部用 NavigationBackHandler，需提供 navigationevent 的 dispatcher owner。
navigationEvent = "1.1.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
miuix-ui-android = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference-android = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons-android = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEvent" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
backdrop-android = { module = "io.github.kyant0:backdrop-android", version.ref = "backdrop" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidSvg" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifInterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
