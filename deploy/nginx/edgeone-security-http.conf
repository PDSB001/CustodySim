# http context; existing private origin-key and client-IP maps are required.
# Never copy the private key into this repository.
geo $custodysim_local_request {
    default 0;
    127.0.0.1 1;
    ::1 1;
}
map "$custodysim_local_request:$custodysim_edgeone_authenticated" $custodysim_origin_allowed {
    default 0;
    ~^1: 1;
    "0:1" 1;
}
map $custodysim_client_ip $custodysim_limit_ip {
    default $custodysim_client_ip;
    "" $remote_addr;
}
map $uri $custodysim_api_ip {
    default "";
    ~^/api/ $custodysim_limit_ip;
}
map $uri $custodysim_api_site {
    default "";
    ~^/api/ $server_name;
}
map $uri $custodysim_page_ip {
    default $custodysim_limit_ip;
    ~^/(api/|socket.io/?|_next/) "";
    ~*\.(svg|png|jpg|jpeg|webp|gif|ico|woff2|css|js)$ "";
}
map $custodysim_page_ip $custodysim_page_site {
    "" "";
    default $server_name;
}
map $uri $custodysim_auth_ip {
    default "";
    ~^/api/auth/(login|register|change-password|mfa/(verify|setup|disable)|security-email/(send|confirm))$ $custodysim_limit_ip;
}
map $custodysim_auth_ip $custodysim_auth_site {
    "" "";
    default $server_name;
}
map $uri $custodysim_download_ip {
    default "";
    /api/app-download/apk $custodysim_limit_ip;
}
map $custodysim_download_ip $custodysim_download_site {
    "" "";
    default $server_name;
}
map $uri $custodysim_socket_ip {
    default "";
    ~^/socket.io/?$ $custodysim_limit_ip;
}
map $custodysim_socket_ip $custodysim_socket_site {
    "" "";
    default $server_name;
}
limit_req_zone $custodysim_api_ip zone=custodysim_api_ip:2m rate=15r/s;
limit_req_zone $custodysim_api_site zone=custodysim_api_site:1m rate=60r/s;
limit_req_zone $custodysim_page_ip zone=custodysim_page_ip:2m rate=10r/s;
limit_req_zone $custodysim_page_site zone=custodysim_page_site:1m rate=30r/s;
limit_req_zone $custodysim_auth_ip zone=custodysim_auth_ip:2m rate=30r/m;
limit_req_zone $custodysim_auth_site zone=custodysim_auth_site:1m rate=2r/s;
limit_req_zone $custodysim_download_ip zone=custodysim_download_rate:1m rate=12r/m;
limit_conn_zone $custodysim_download_ip zone=custodysim_download_ip:1m;
limit_conn_zone $custodysim_download_site zone=custodysim_download_site:1m;
limit_conn_zone $custodysim_socket_ip zone=custodysim_socket_ip:2m;
limit_conn_zone $custodysim_socket_site zone=custodysim_socket_site:1m;
# No cookies, tokens, query strings or origin credential in this log.
log_format custodysim_security escape=json
    '{"time":"$time_iso8601","client":"$custodysim_client_ip","peer":"$remote_addr",'
    '"edge":"$custodysim_edgeone_authenticated","uri":"$uri","status":$status,'
    '"probe":"$arg_custodysim_probe","rate":"$limit_req_status","connections":"$limit_conn_status"}';
