# HTTPS server context. Limits use URI-scoped keys, so child locations inherit
# all protections without copying proxy headers, upload sizes or WebSocket rules.
if ($custodysim_origin_allowed = 0) { return 403; }
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
limit_req zone=custodysim_api_ip burst=60 nodelay;
limit_req zone=custodysim_api_site burst=120 nodelay;
limit_req zone=custodysim_page_ip burst=30 nodelay;
limit_req zone=custodysim_page_site burst=60 nodelay;
limit_req zone=custodysim_auth_ip burst=5 nodelay;
limit_req zone=custodysim_auth_site burst=4 nodelay;
limit_req zone=custodysim_download_rate burst=5 nodelay;
limit_conn custodysim_download_ip 2;
limit_conn custodysim_download_site 16;
limit_conn custodysim_socket_ip 64;
limit_conn custodysim_socket_site 768;
access_log /var/log/nginx/custodysim-security.log custodysim_security;
access_log /var/log/nginx/access.log combined;
