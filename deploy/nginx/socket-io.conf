# 生产实时通道（Socket.IO）反代片段
#
# 用法：把下面 `location /socket.io/ { ... }` 整段贴进现有 HTTPS server 块（443 那个），
# 建议放在通用 location 附近便于维护；普通前缀按最长前缀匹配，不依赖书写顺序。
#
# 背景：`custodysim-chat-realtime` 默认监听 0.0.0.0:3001；Nginx 通过回环地址连接。
# 生产防火墙应限制该端口，不将后端端口直接暴露到不可信公网。
# Web 浏览器与 Android release（`wss://<你的域名>`，由 BASE_URL 的 https 推导）
# 都按同域 `/socket.io/` 连它，所以这一层必须由 nginx 转发。
#
# 缺了这段反代的症状：`/socket.io?...` 返回 404（Next 兜底），
# 带斜杠的 `/socket.io/?...` 返回 308 重定向；应用与 /api/* 一切正常，
# 聊天不报错但实时推送静默失效，只能靠降级轮询 —— 即"生产环境实时没起来"。

location /socket.io/ {
    # proxy_pass 末尾不要带路径：写成 http://127.0.0.1:3001/ 会把 /socket.io 前缀剥掉。
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # WebSocket 升级握手。少了这两行只能退化成 polling，长连接还容易被断开。
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 与 realtime-server.mjs 的 pingInterval 25s / pingTimeout 20s 配套，留足余量。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Socket.IO 是长连接，关掉缓冲避免握手响应被攒住。
    proxy_buffering off;
}

# 改动后执行：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 逐项验证：
#   # 1) 公开握手：应返回 0{"sid":...}，而不是 404 / 308
#   curl -s "https://<你的域名>/socket.io/?EIO=4&transport=polling"
#   # 2) 实时进程在跑（两条都应在列表里）
#   pm2 list | grep -E "custodysim|custodysim-chat-realtime"
#   # 3) 进程本地健康检查
#   curl -s http://127.0.0.1:3001/health
#
# 浏览器侧还需要服务端配置 APP_ORIGIN（realtime-server.mjs 在生产用它做来源白名单；
# Android 客户端不发 Origin，不受此限制）。APP_ORIGIN 写站点根地址，例如 https://<你的域名>。
