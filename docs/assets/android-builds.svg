<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="661" viewBox="0 0 1280 661" role="img" aria-labelledby="title desc"><title id="title">Android 构建与分发</title><desc id="desc">四个变体共用原生阅读路径；发布包与对应源码来自同一提交</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8ca8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:38px;font-weight:700;fill:#25233f}.sub{font-size:19px;fill:#67667d}.label{font-size:23px;font-weight:700;fill:#30264d}.body{font-size:19px;fill:#57566b}.small{font-size:17px;fill:#646178}.num{font-size:16px;font-weight:700;fill:#6d49ba}.arrow{fill:none;stroke:#8b8ca8;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1280" height="661" rx="24" fill="#f5f4fa"/><rect x="40" y="38" width="7" height="70" rx="3.5" fill="#7c4dcd"/><text class="title" x="68" y="72">Android 构建与分发</text><text class="sub" x="68" y="106">四个变体共用原生阅读路径；发布包与对应源码来自同一提交</text><rect x="48" y="150" width="274" height="180" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="70" y="180">DEVELOP</text><text class="label" x="70" y="211">debug</text><text class="body" x="70" y="244">.dev 应用 ID</text><text class="body" x="70" y="273">关闭 R8</text><text class="body" x="70" y="302">联调预置地址</text><rect x="352" y="150" width="274" height="180" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="374" y="180">VERIFY</text><text class="label" x="374" y="211">debugR8</text><text class="body" x="374" y="244">.dev 应用 ID</text><text class="body" x="374" y="273">开启 R8 / 资源收缩</text><text class="body" x="374" y="302">本机 debug 签名</text><rect x="656" y="150" width="274" height="180" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="num" x="678" y="180">DISTRIBUTE</text><text class="label" x="678" y="211">production</text><text class="body" x="678" y="244">正式应用 ID</text><text class="body" x="678" y="273">开启 R8 / 资源收缩</text><text class="body" x="678" y="302">预置远端服务器</text><rect x="960" y="150" width="272" height="180" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="num" x="982" y="180">DISTRIBUTE</text><text class="label" x="982" y="211">release</text><text class="body" x="982" y="244">正式应用 ID</text><text class="body" x="982" y="273">开启 R8 / 资源收缩</text><text class="body" x="982" y="302">无预置服务器</text><rect x="48" y="377" width="568" height="148" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="70" y="416">CI 检查与未签名构建</text><text class="body" x="70" y="450">单测 · lint · 上游哈希 · 对应源码校验</text><text class="body" x="70" y="479">产物：Debug / 未签名 Release / 源码</text><rect x="664" y="377" width="568" height="148" rx="16" fill="#e4f1ee" stroke="#e0dced"/><text class="label" x="686" y="416">维护者本机正式分发</text><text class="body" x="686" y="450">选择提交 → 本机签名 → 真机验收</text><text class="body" x="686" y="479">提供准确对应源码与 SHA-256</text><text class="body" x="70" y="590">密钥不上传 CI；APK 与签名材料不进 Git。覆盖安装前核对应用 ID 和签名连续性。</text><text class="small" x="48" y="637">CustodySim · 2026-10-18 · 当前代码结构示意，非生产监控数据</text></svg>
