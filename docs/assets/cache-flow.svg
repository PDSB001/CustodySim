<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">缓存字节，不缓存授权</title><desc id="desc">EdgeOne HIT 也要通过本次权限校验；App 磁盘缓存先校验元数据</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8ca8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:38px;font-weight:700;fill:#25233f}.sub{font-size:19px;fill:#67667d}.label{font-size:23px;font-weight:700;fill:#30264d}.body{font-size:19px;fill:#57566b}.small{font-size:17px;fill:#646178}.num{font-size:16px;font-weight:700;fill:#6d49ba}.arrow{fill:none;stroke:#8b8ca8;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1280" height="820" rx="24" fill="#f5f4fa"/><rect x="40" y="38" width="7" height="70" rx="3.5" fill="#7c4dcd"/><text class="title" x="68" y="72">缓存字节，不缓存授权</text><text class="sub" x="68" y="106">EdgeOne HIT 也要通过本次权限校验；App 磁盘缓存先校验元数据</text><rect x="48" y="150" width="556" height="118" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="70" y="189">Web / App 发起资源请求</text><text class="body" x="70" y="223">保留 Cookie 或 Bearer 与当前资源路径</text><rect x="676" y="150" width="556" height="118" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="label" x="698" y="189">源站实时鉴权</text><text class="body" x="698" y="223">账号 · 会话 · 资源范围 · 内容版本</text><path class="arrow" d="M604 209 H672"/><path class="arrow" d="M954 268 V301 H640 V327"/><rect x="344" y="332" width="592" height="100" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="366" y="371">命名 Cache API 查找公共副本</text><text class="body" x="366" y="405">缓存键不含用户凭据；正文不保存个人字段</text><path class="arrow" d="M488 432 V465 H326 V487"/><path class="arrow" d="M792 432 V465 H954 V487"/><rect x="48" y="492" width="556" height="113" rx="16" fill="#e4f1ee" stroke="#e0dced"/><text class="label" x="70" y="531">HIT · 返回已有字节</text><text class="body" x="70" y="565">当次 readerKey 放在响应头，不写缓存</text><rect x="676" y="492" width="556" height="113" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="698" y="531">MISS · 验权取字节并保存</text><text class="body" x="698" y="565">按内容版本隔离；文件/正文可后台写缓存</text><rect x="48" y="646" width="1184" height="112" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="label" x="70" y="685">Android 再次打开：metadata → 128 MiB 阅读磁盘缓存</text><text class="body" x="70" y="719">原生正文 / PDF / 插图按服务器、用户阅读标识与版本隔离；失效重新下载。</text><text class="small" x="48" y="796">CustodySim · 2026-10-18 · 当前代码结构示意，非生产监控数据</text></svg>
