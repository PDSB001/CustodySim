<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="664" viewBox="0 0 1280 664" role="img" aria-labelledby="title desc"><title id="title">增量部署，逐步验收</title><desc id="desc">执行 bash scripts/deploy.sh；已有进程、备份和通过的 CI 是前提</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8ca8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:38px;font-weight:700;fill:#25233f}.sub{font-size:19px;fill:#67667d}.label{font-size:23px;font-weight:700;fill:#30264d}.body{font-size:19px;fill:#57566b}.small{font-size:17px;fill:#646178}.num{font-size:16px;font-weight:700;fill:#6d49ba}.arrow{fill:none;stroke:#8b8ca8;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1280" height="664" rx="24" fill="#f5f4fa"/><rect x="40" y="38" width="7" height="70" rx="3.5" fill="#7c4dcd"/><text class="title" x="68" y="72">增量部署，逐步验收</text><text class="sub" x="68" y="106">执行 bash scripts/deploy.sh；已有进程、备份和通过的 CI 是前提</text><rect x="48" y="152" width="274" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="70" y="182">01</text><text class="label" x="70" y="213">拉取代码</text><text class="body" x="70" y="246">git pull --ff-only</text><text class="body" x="70" y="275">工作区修改先处理</text><rect x="352" y="152" width="274" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="374" y="182">02</text><text class="label" x="374" y="213">安装与检查</text><text class="body" x="374" y="246">frozen-lockfile</text><text class="body" x="374" y="275">检查可选缓存配置</text><rect x="656" y="152" width="274" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="678" y="182">03</text><text class="label" x="678" y="213">构建</text><text class="body" x="678" y="246">Next.js / Turbopack</text><text class="body" x="678" y="275">失败则停止后续步骤</text><rect x="960" y="152" width="272" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="982" y="182">04</text><text class="label" x="982" y="213">复制静态资源</text><text class="body" x="982" y="246">public + .next/static</text><text class="body" x="982" y="275">进入 standalone</text><path class="arrow" d="M322 227 H348"/><path class="arrow" d="M626 227 H652"/><path class="arrow" d="M930 227 H956"/><rect x="48" y="354" width="362" height="151" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="num" x="70" y="384">05</text><text class="label" x="70" y="415">增量数据库升级</text><text class="body" x="70" y="448">逐项执行已登记脚本</text><text class="body" x="70" y="477">先核对结构与目标数据库</text><rect x="459" y="354" width="362" height="151" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="num" x="481" y="384">06</text><text class="label" x="481" y="415">重启两个 PM2 进程</text><text class="body" x="481" y="448">Web / 实时服务</text><text class="body" x="481" y="477">加载更新后的环境配置</text><rect x="870" y="354" width="362" height="151" rx="16" fill="#e4f1ee" stroke="#e0dced"/><text class="num" x="892" y="384">07</text><text class="label" x="892" y="415">HTTP / 实时自检</text><text class="body" x="892" y="448">页面、资源、匿名 API、健康</text><text class="body" x="892" y="477">公网 Socket.IO 握手</text><path class="arrow" d="M410 430 H455"/><path class="arrow" d="M821 430 H866"/><text class="label" x="70" y="561">失败先看已完成阶段，不等于自动回滚</text><text class="body" x="70" y="598">应用回退与数据库恢复分别处理；脚本不发布边缘函数，也不修改 Nginx。</text><text class="small" x="48" y="640">CustodySim · 2026-10-18 · 当前代码结构示意，非生产监控数据</text></svg>
