<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="666" viewBox="0 0 1280 666" role="img" aria-labelledby="title desc"><title id="title">按角色找到操作入口</title><desc id="desc">先完成手上的工作，再进入对应技术细节</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8ca8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:38px;font-weight:700;fill:#25233f}.sub{font-size:19px;fill:#67667d}.label{font-size:23px;font-weight:700;fill:#30264d}.body{font-size:19px;fill:#57566b}.small{font-size:17px;fill:#646178}.num{font-size:16px;font-weight:700;fill:#6d49ba}.arrow{fill:none;stroke:#8b8ca8;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1280" height="666" rx="24" fill="#f5f4fa"/><rect x="40" y="38" width="7" height="70" rx="3.5" fill="#7c4dcd"/><text class="title" x="68" y="72">按角色找到操作入口</text><text class="sub" x="68" y="106">先完成手上的工作，再进入对应技术细节</text><rect x="48" y="154" width="362" height="179" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="70" y="184">01 / USE</text><text class="label" x="70" y="215">日常使用者</text><text class="body" x="70" y="248">登录 → 点名 / 任务 / 申请</text><text class="body" x="70" y="277">档案 · 聊天 · 阅读 · 社区</text><text class="body" x="70" y="306">使用指南 / 常见问题</text><rect x="459" y="154" width="362" height="179" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="481" y="184">02 / MANAGE</text><text class="label" x="481" y="215">监管与管理人员</text><text class="body" x="481" y="248">范围配置 → 审核工作台</text><text class="body" x="481" y="277">查看原因、轨迹与最终状态</text><text class="body" x="481" y="306">管理指南 / 自动审核</text><rect x="870" y="154" width="362" height="179" rx="16" fill="#fff" stroke="#e0dced"/><text class="num" x="892" y="184">03 / MAINTAIN</text><text class="label" x="892" y="215">开发与运维人员</text><text class="body" x="892" y="248">开发测试 → CI → 手动发布</text><text class="body" x="892" y="277">配置、备份、日志与缓存验收</text><text class="body" x="892" y="306">开发指南 / 部署 / 运维</text><rect x="48" y="372" width="568" height="151" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="label" x="70" y="411">Web / API 文档</text><text class="body" x="70" y="445">身份与业务规则、部署、EdgeOne</text><text class="body" x="70" y="474">路径：CustodySim / docs</text><rect x="664" y="372" width="568" height="151" rx="16" fill="#e4f1ee" stroke="#e0dced"/><text class="label" x="686" y="411">Android 文档</text><text class="body" x="686" y="445">构建变体、权限、阅读缓存、对应源码</text><text class="body" x="686" y="474">路径：CustodySim-app / docs</text><text class="label" x="70" y="582">历史记录保留原语境，当前操作使用最新指南</text><text class="body" x="70" y="616">已修复与剩余问题分别记录；旧版本、测试数量和设备表现不代表今天的生产状态。</text><text class="small" x="48" y="642">CustodySim · 2026-10-18 · 当前代码结构示意，非生产监控数据</text></svg>
