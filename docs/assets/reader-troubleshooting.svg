<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="794" viewBox="0 0 1280 794" role="img" aria-labelledby="title desc"><title id="title">阅读慢或失败，按阶段定位</title><desc id="desc">先确认正文完整可读，再分析缓存命中和速度</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8ca8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:38px;font-weight:700;fill:#25233f}.sub{font-size:19px;fill:#67667d}.label{font-size:23px;font-weight:700;fill:#30264d}.body{font-size:19px;fill:#57566b}.small{font-size:17px;fill:#646178}.num{font-size:16px;font-weight:700;fill:#6d49ba}.arrow{fill:none;stroke:#8b8ca8;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1280" height="794" rx="24" fill="#f5f4fa"/><rect x="40" y="38" width="7" height="70" rx="3.5" fill="#7c4dcd"/><text class="title" x="68" y="72">阅读慢或失败，按阶段定位</text><text class="sub" x="68" y="106">先确认正文完整可读，再分析缓存命中和速度</text><rect x="48" y="150" width="556" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="70" y="189">01 · HTTP 状态</text><text class="body" x="70" y="223">545 / 5xx：查边缘函数与源站日志</text><text class="body" x="70" y="252">401 / 403 / 404：核对身份与资源权限</text><rect x="676" y="150" width="556" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="698" y="189">02 · 字节与格式</text><text class="body" x="698" y="223">200/HIT 也可能未完整传输或解码失败</text><text class="body" x="698" y="252">检查压缩标记、传输大小与恢复原因</text><path class="arrow" d="M604 226 H672"/><rect x="48" y="344" width="556" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="70" y="383">03 · 等待与下载</text><text class="body" x="70" y="417">TTFB：实时鉴权、源站和节点等待</text><text class="body" x="70" y="446">下载：链路、压缩与真实传输字节</text><rect x="676" y="344" width="556" height="151" rx="16" fill="#fff" stroke="#e0dced"/><text class="label" x="698" y="383">04 · 解析与首屏</text><text class="body" x="698" y="417">JSON / 解压 / 章节解析 / 排版分开计时</text><text class="body" x="698" y="446">App 重开先 metadata，再复用磁盘</text><path class="arrow" d="M604 419 H672"/><rect x="48" y="542" width="1184" height="150" rx="16" fill="#ece8f7" stroke="#e0dced"/><text class="label" x="70" y="581">出现 /document-origin？</text><text class="body" x="70" y="615">表示一次受控恢复已触发，不能仅凭第一条 200 判断成功。</text><text class="body" x="70" y="644">查看 http-5xx / body-transfer / invalid-json / shared-identity；恢复路径不触发函数。</text><text class="body" x="70" y="741">反馈：版本、时间、路径、状态、Timing 和诊断头。遮挡 Cookie / Authorization / 正文个人信息。</text><text class="small" x="48" y="770">CustodySim · 2026-10-18 · 当前代码结构示意，非生产监控数据</text></svg>
