allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# These exact releases use the official @eslint/compat rule adapters.
# Accept only this tested host version; do not suppress other peer mismatches.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react@7.37.5>eslint": "10.13.0"
    "eslint-plugin-import@2.32.0>eslint": "10.13.0"
    "eslint-plugin-jsx-a11y@6.10.2>eslint": "10.13.0"

# Security updates scoped to the two upstream consumers; exercised by offline
# loader/SDK regressions and the Drizzle schema export comparison.
overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.28.2"
  "tencentcloud-sdk-nodejs-common@4.1.220>uuid": "14.0.3"
